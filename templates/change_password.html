{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="text-center mb-8">
        <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white text-2xl shadow-lg shadow-blue-500/30">
            <i class="fas fa-key"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-900">Change Password</h1>
        <p class="text-gray-500 mt-2 text-sm">Update your account password</p>
    </div>

    <div class="bg-white rounded-3xl border border-gray-100 shadow-xl p-8">
        <form method="POST" action="{% url 'change_password' %}" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Current Password</label>
                <input type="password" name="old_password" required placeholder="Enter current password" class="w-full p-3.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">New Password</label>
                <input type="password" name="new_password" required placeholder="At least 6 characters" class="w-full p-3.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="Re-enter new password" class="w-full p-3.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold shadow-md transition-all">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
