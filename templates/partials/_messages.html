{% if messages %}
<div class="container mx-auto px-4 pt-4">
    {% for message in messages %}
    <div class="flex items-center gap-2 p-3 rounded-lg mb-2 text-sm font-medium {% if message.tags == 'success' %}bg-green-50 border border-green-200 text-green-800{% elif message.tags == 'error' %}bg-red-50 border border-red-200 text-red-800{% else %}bg-blue-50 border border-blue-200 text-blue-800{% endif %}">
        <i class="fas {% if message.tags == 'success' %}fa-check-circle text-green-500{% elif message.tags == 'error' %}fa-exclamation-circle text-red-500{% else %}fa-info-circle text-blue-500{% endif %}"></i>
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
